name: Insights news scan

# Weekly sweep of industry feeds for stories worth a Unicon perspective.
#
# This deliberately does NOT write or publish anything. It opens an issue
# with a shortlist of candidate triggers. A human picks one, it gets written,
# reviewed and approved, and only then does it go live.
#
# Two reasons it works this way:
#   - Several sources are paywalled. Only headlines and links are used.
#   - Auto-publishing rehashed news is the pattern search engines penalise
#     as scaled content abuse, which would put the whole domain at risk.

on:
  schedule:
    # 05:00 UTC Monday = 07:00 SAST
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Relevance score threshold'
        required: false
        default: '6'

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Remembers what has already been surfaced, without committing to the repo.
      - name: Restore seen-links cache
        uses: actions/cache@v4
        with:
          path: tools/.news-seen.json
          key: insights-seen-${{ github.run_id }}
          restore-keys: insights-seen-

      - name: Verify feeds still resolve
        continue-on-error: true
        run: python3 tools/scan_news.py --verify

      - name: Scan for candidate triggers
        run: |
          python3 tools/scan_news.py --scan --markdown \
            --threshold "${{ github.event.inputs.threshold || '6' }}" \
            --limit 8 --mark-seen > digest.md
          cat digest.md

      - name: Open digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "No trigger stories cleared" digest.md; then
            echo "Nothing relevant this week — not opening an issue."
            exit 0
          fi
          {
            cat digest.md
            echo
            echo "---"
            echo "**How to use this:** pick a story that connects to work Unicon has actually done, then write the piece from that experience — the news is the hook, the project is the substance."
            echo
            echo "\`\`\`"
            echo "python3 tools/insights.py new --slug <slug> --title \"...\" \\"
            echo "    --category \"Bulk Water\" --summary \"...\" --image \"<url>\""
            echo "\`\`\`"
            echo
            echo "The draft stays out of the index and the RSS feed until it is approved."
            echo
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > body.md
          gh issue create \
            --title "Insights triggers — week of $(date -u +'%d %B %Y')" \
            --body-file body.md \
            --label insights 2>/dev/null \
          || gh issue create \
            --title "Insights triggers — week of $(date -u +'%d %B %Y')" \
            --body-file body.md
